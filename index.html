<!DOCTYPE html>
<html>
  <head>
    <script>
      const path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace('https://jensenzhoujh.github.io' + path);
    </script>
    <title>Redirecting...</title>
  </head>
  <body>
    <p>If you're not redirected, <a id="link" href="#">click here</a>.</p>
    <script>
      document.getElementById('link').href = 'https://jensenzhoujh.github.io' + window.location.pathname;
    </script>
  </body>
</html>
