<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Redirect to the same path on the new domain
        var newDomain = 'https://jensenzhoujh.github.io';
        var newPath = window.location.pathname + window.location.search + window.location.hash;
        window.location.href = newDomain + newPath;
    </script>
</head>
<body>
    <p>If you are not redirected automatically, <a id="redirectLink" href="#">click here</a>.</p>
    <script type="text/javascript">
        document.getElementById('redirectLink').href = newDomain + newPath;
    </script>
</body>
</html>
